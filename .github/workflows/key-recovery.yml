# 임시(2026-11-22): 서명 키 원본을 되찾기 위해 한 번만 돌리고 지움.
# 비밀 설정을 아래 공개 자물쇠(RSA)로 잠가서만 내보냄 — 여는 열쇠는 선생님 맥미니에만 있음. 로그에 아무것도 찍지 않음.
name: Key recovery (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Seal signing key with recovery public key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -eu
          umask 077
          W="$RUNNER_TEMP/k"; mkdir -p "$W/b"
          cat > "$W/recv.pub" <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAy4NKjuLWxGofl4470DxB
          GCx7KIyaS3W8v7XWvPAtNKrRh1SjU+Ro/M8qEetNbQP5uABtDxCSgRiQwr9dtVoS
          DtKp+mA5AkTxJNb0Z4CCY/ttdZKCCDvu/k5jq0fDSahTZzSpz9hQ8ynz+WMBfle+
          CUnAo4rahhMdAJ0/udJG0AsHKhCeEWebfOLBXJjFtw6MArAg0SuDm7mzUZZtXcM2
          t8qZJmy4GXN+DkdtPEqS9O2PyUPwztXqyG4ixwIFFkka+Un7wsXcV/akoDHj5/sr
          UTwVQFUNgn7Sxr9LrNT4jaLinBu7jr7koYmOZHYGb4E3gcYXJR+TP6H25YJ83S9m
          odNsyvdaDlwFqLiRn42GE/p6cFY3BVNBsXjZ/Ef8pgfS3Xh/z+e1Uy2ROKmz7UPA
          S2AygLWq6eDFvyDbVyMjMF7Vrjm+MAls0rwWB5FaR4T9VUjHfVP2/pWczF70fEKo
          Wflguoyka+YYIypz4fHPrDJMFQM2yras3w+R+8KFZkfAAFM9z/la1zjlbezdLmjv
          uBcRFKnSpCtYUv8ALozQzsH6gz9Ij4Nv5t3nwx4XzbCJ3HYM3QSGSGSaquo1gqtc
          GqsJfXYJGFgBcsU0nMVmnZ0ESzSVoMs6/YCRmenb//XOCis4XL8teBEEbncJSn5K
          DNdoffIp36ZpmU79XaLeaHMCAwEAAQ==
          -----END PUBLIC KEY-----
          PUBKEY
          sed -i 's/^ *//' "$W/recv.pub"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$W/b/ssamtox-release.p12"
          printf '%s' "$STORE_PASSWORD" > "$W/b/store_password.txt"
          printf '%s' "$KEY_ALIAS" > "$W/b/key_alias.txt"
          tar -C "$W/b" -cf "$W/bundle.tar" .
          openssl rand 32 > "$W/aes.key"
          mkdir -p sealed
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$W/bundle.tar" -out sealed/bundle.enc -pass file:"$W/aes.key"
          openssl pkeyutl -encrypt -pubin -inkey "$W/recv.pub" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$W/aes.key" -out sealed/aes.key.enc
          rm -rf "$W"
          ls -l sealed
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-key
          path: sealed/
          retention-days: 1
