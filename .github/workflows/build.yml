name: Build APK

on:
  # 모든 브랜치에서 시험은 돌고, APK 빌드·배포는 main 에서만(시험이 통과해야)
  # 안내 페이지(docs)·문서(.md)만 바꾼 것은 앱을 다시 만들지 않음(같은 APK 가 새 빌드로 또 올라가던 것)
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 🧪 규칙 시험(src/test) — AI 모델이 필요한 시뮬레이션은 OLLAMA_MODEL 이 없으면 저절로 건너뜀
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 🔐 서명 키는 저장소가 아니라 GitHub Secrets에서만 꺼내 씀 (빌드가 끝나면 러너와 함께 사라짐)
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "SIGNING_KEYSTORE_B64 secret이 없어요"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ssamtox-release.p12"
          echo "SSAMTOX_KEYSTORE=$RUNNER_TEMP/ssamtox-release.p12" >> "$GITHUB_ENV"

      - name: Build APK (release)
        env:
          SSAMTOX_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SSAMTOX_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          rm -f "$SSAMTOX_KEYSTORE"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk SsamTox-${{ github.run_number }}.apk
          # 이름이 항상 같은 사본: releases/latest/download/SsamTox.apk 링크 하나로 늘 최신본을 받게
          cp app/build/outputs/apk/release/app-release.apk SsamTox.apk
          sha256sum SsamTox.apk | tee SsamTox.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SsamTox-apk
          path: SsamTox-*.apk

      # 폰에서 받기 쉽도록 릴리스(Releases)에 APK 첨부
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 쌤톡스 빌드 ${{ github.run_number }}
          make_latest: true
          files: |
            SsamTox-${{ github.run_number }}.apk
            SsamTox.apk
            SsamTox.apk.sha256
