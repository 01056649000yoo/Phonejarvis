name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SsamTox-${{ github.run_number }}.apk
          # 이름이 항상 같은 사본: releases/latest/download/SsamTox.apk 링크 하나로 늘 최신본을 받게
          cp app/build/outputs/apk/debug/app-debug.apk SsamTox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SsamTox-apk
          path: SsamTox-*.apk

      # 폰에서 받기 쉽도록 릴리스(Releases)에 APK 첨부
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 쌤톡스 빌드 ${{ github.run_number }}
          make_latest: true
          files: |
            SsamTox-${{ github.run_number }}.apk
            SsamTox.apk
