name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhoneJarvis-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneJarvis-apk
          path: PhoneJarvis-*.apk

      # 폰에서 받기 쉽도록 릴리스(Releases)에 APK 첨부
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 휴대폰 자비스 빌드 ${{ github.run_number }}
          files: PhoneJarvis-*.apk
